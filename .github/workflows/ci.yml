name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Build each project on its own: the .NET 8 SDK cannot read ParentalControl.slnx.
      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            dotnet build $_.FullName -c Debug
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The tests are a console program with Debug.Assert, so they run in Debug.
      # A failed assert stops the process with a non-zero exit code.
      - name: Test
        shell: pwsh
        run: dotnet run --project tests/ParentalControl.Tests -c Debug
