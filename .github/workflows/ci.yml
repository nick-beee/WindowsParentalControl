name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The web admin (web/admin, ADR 0009): lint, type check, component tests, then the bundle.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Web admin - install
        working-directory: web/admin
        run: npm ci --no-audit --no-fund

      - name: Web admin - lint
        working-directory: web/admin
        run: npm run lint

      - name: Web admin - type check
        working-directory: web/admin
        run: npm run typecheck

      - name: Web admin - tests
        working-directory: web/admin
        run: npm test

      - name: Web admin - build
        working-directory: web/admin
        run: npm run build

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Build each project in src on its own, so a failure names the project.
      # The steps above built the web admin, so the service build embeds it without npm.
      - name: Build
        shell: pwsh
        run: |
          Get-ChildItem src -Recurse -Filter *.csproj | ForEach-Object {
            dotnet build $_.FullName -c Debug -p:SkipAdminSpaBuild=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # The tests are a console program with Debug.Assert, so they run in Debug.
      # A failed assert stops the process with a non-zero exit code.
      - name: Test
        shell: pwsh
        run: dotnet run --project tests/ParentalControl.Tests -c Debug

      # The xUnit tests of the pure domain logic (no WinAPI). They also run on the Mac.
      - name: Domain tests
        shell: pwsh
        run: dotnet test tests/ParentalControl.Domain.Tests -c Debug
